<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIRA | تنظیمات حساب کاربری</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="settings-page">

    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo">
            <img src="assets/images/logo.png" alt="AVIRA">
        </a>

        <nav>
            <a href="index.html">خانه</a>
            <a href="index.html#collection">مجموعه‌ها</a>
            <a href="custom-order.html">سفارش اختصاصی</a>
        </nav>

        <!-- بخش منوی کاربری -->
        <div id="auth-header-container">
            <div id="logged-out-view">
                <a href="login.html" class="auth-btn">ورود / ثبت‌نام</a>
            </div>

            <div id="logged-in-view" style="display: none;">
                <div class="user-dropdown">
                    <button class="user-dropdown-btn" onclick="toggleUserDropdown()">
                        👤 <span id="user-display-email">حساب من</span> ▾
                    </button>
                    <div class="dropdown-menu" id="user-dropdown-menu">
                        <a href="orders.html">📦 سفارشات من</a>
                        <a href="cart.html">🛒 سبد خرید من</a>
                        <a href="settings.html">⚙️ تنظیمات حساب</a>
                        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 5px 0;">
                        <a href="#" onclick="logoutUser()" style="color: #f87171;">🚪 خروج از حساب</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="menu">☰</div>
    </header>

    <!-- کادر اصلی تنظیمات -->
    <main class="custom-container" style="margin-top: 100px; max-width: 600px;">
        <h1 style="color: #d4af37; font-size: 2rem; margin-bottom: 20px;">⚙️ تنظیمات حساب کاربری</h1>

        <!-- بخش ویرایش پروفایل -->
        <form id="profile-settings-form" onsubmit="event.preventDefault(); updateProfile();">
            <h3 style="color: #fff; font-size: 1.1rem; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 8px; margin-bottom: 15px;">اطلاعات شخص</h3>

            <div class="form-group">
                <label for="settings-email">ایمیل (غیرقابل تغییر):</label>
                <input type="email" id="settings-email" disabled style="opacity: 0.6; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label for="settings-fullname">نام و نام خانوادگی:</label>
                <input type="text" id="settings-fullname" placeholder="مثال: علی محمدی">
            </div>

            <div class="form-group">
                <label for="settings-phone">شماره همراه:</label>
                <input type="tel" id="settings-phone" placeholder="۰۹۱۲۱۲۳۴۵۶۷">
            </div>

            <div class="form-group">
                <label for="settings-address">آدرس تحویل سفارش:</label>
                <textarea id="settings-address" placeholder="استان، شهر، خیابان اصلی، کوچه، پلاک، واحد..." style="height: 90px;"></textarea>
            </div>

            <button type="submit" class="btn-submit" style="width: 100%; margin-top: 10px;">ذخیره اطلاعات شخصی</button>
        </form>

        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 30px 0;">

        <!-- بخش تغییر رمز عبور -->
        <form id="password-settings-form" onsubmit="event.preventDefault(); updatePassword();">
            <h3 style="color: #fff; font-size: 1.1rem; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 8px; margin-bottom: 15px;">تغییر رمز عبور</h3>

            <div class="form-group">
                <label for="settings-new-pass">رمز عبور جدید:</label>
                <input type="password" id="settings-new-pass" placeholder="حداقل ۶ کاراکتر" required minlength="6">
            </div>

            <button type="submit" class="btn-submit" style="width: 100%; margin-top: 10px; background: linear-gradient(135deg, #4b5563, #374151) !important; color: #fff !important;">به‌روزرسانی رمز عبور</button>
        </form>
    </main>

    <script src="script.js"></script>
    <script>
        // لود کردن اطلاعات فعلی کاربر هنگام باز شدن صفحه
        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof loadUserSettings === "function") {
                loadUserSettings();
            }
        });
    </script>
    <div id="user-support-tickets-list"></div>
    
</body>
</html>
