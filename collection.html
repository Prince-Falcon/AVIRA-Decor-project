<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهده مجموعه | AVIRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="collection-page">

<!-- هدر سایت -->
<header class="header">
    <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="assets/images/logo.png" alt="AVIRA" style="width: 35px; height: 35px; object-fit: contain;">
        <span style="color: #fff; font-weight: bold; letter-spacing: 1px;">AVIRA</span>
    </a>

    <nav>
        <a href="index.html">خانه</a>
        <a href="index.html#collection">مجموعه‌ها</a>
        <a href="custom-order.html">سفارش اختصاصی</a>
    </nav>

    <div id="auth-header-container">
        <div id="logged-out-view">
            <a href="login.html" class="auth-btn">ورود / ثبت‌نام</a>
        </div>

        <div id="logged-in-view" style="display: none;">
            <div class="user-dropdown">
                <button class="user-dropdown-btn" onclick="toggleUserDropdown()">
                    👤 <span id="user-display-email">حساب من</span> ▾
                </button>
                <div class="dropdown-menu" id="user-dropdown-menu">
                    <a href="orders.html">📦 سفارشات من</a>
                    <a href="cart.html">🛒 سبد خرید من</a>
                    <a href="settings.html">⚙️ تنظیمات حساب</a>
                    <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 5px 0;">
                    <a href="#" onclick="logoutUser()" style="color: #f87171;">🚪 خروج از حساب</a>
                </div>
            </div>
        </div>
    </div>

    <div class="menu">☰</div>
</header>

<section class="collection-header">
    <h1 id="collection-title">مجموعه</h1>
    <p>طرح مورد نظر خود را انتخاب کنید</p>
</section>

<main class="products-grid" id="products-grid">
</main>

<div id="product-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeProductModal()">&times;</span>
        
        <div class="modal-body">
            <div class="modal-image">
                <img id="modal-product-img" src="" alt="طرح">
            </div>
            
            <div class="modal-details">
                <h2 id="modal-product-title">نام طرح</h2>
                <p class="price" id="modal-product-price">۲۵۰,۰۰۰ تومان</p>

                <div class="size-selection">
                    <label>انتخاب سایز:</label>
                    <div class="size-options">
                        <button type="button" class="size-btn active" onclick="selectSize(this)">۲۰×۲۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۲۰×۳۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۳۰×۳۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۳۰×۴۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۴۰×۴۰ سانتی‌متر</button>
                    </div>
                </div>

                <button class="btn-submit add-to-cart-btn" onclick="addToCart()">افزودن به سبد خرید</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

<!-- بخش انتخاب جنس محصول -->
<div class="material-selection">
  <label class="section-label">انتخاب جنس / کیفیت:</label>
  <div class="material-options">
    
    <label class="material-card">
      <input type="radio" name="material" value="economy" checked>
      <div class="card-content">
        <span class="material-title">Economy</span>
        <span class="material-desc">اقتصادی و به صرفه</span>
      </div>
    </label>

    <label class="material-card">
      <input type="radio" name="material" value="normal">
      <div class="card-content">
        <span class="material-title">Normal</span>
        <span class="material-desc">کیفیت استاندارد</span>
      </div>
    </label>

    <label class="material-card">
      <input type="radio" name="material" value="luxury">
      <div class="card-content">
        <span class="material-title">Luxury</span>
        <span class="material-desc">لوکس با پایان‌کاری ویژه</span>
      </div>
    </label>

    <label class="material-card">
      <input type="radio" name="material" value="metal">
      <div class="card-content">
        <span class="material-title">Metal</span>
        <span class="material-desc">پلاک / صفحه فلزی مقاوم</span>
      </div>
    </label>

  </div>
</div>
<div class="material-selection">
  <label class="section-label">انتخاب جنس / کیفیت:</label>
  <div class="material-options">
    
    <label class="material-card">
      <input type="radio" name="material" value="economy" data-multiplier="0.85" onchange="updateTotalPrice()">
      <div class="card-content">
        <span class="material-title">Economy</span>
        <span class="material-desc">اقتصادی (-۱۵٪)</span>
      </div>
    </label>

    <label class="material-card">
      <input type="radio" name="material" value="normal" data-multiplier="1.0" checked onchange="updateTotalPrice()">
      <div class="card-content">
        <span class="material-title">Normal</span>
        <span class="material-desc">استاندارد</span>
      </div>
    </label>

    <label class="material-card">
      <input type="radio" name="material" value="luxury" data-multiplier="1.35" onchange="updateTotalPrice()">
      <div class="card-content">
        <span class="material-title">Luxury</span>
        <span class="material-desc">لوکس (+۳۵٪)</span>
      </div>
    </label>

    <label class="material-card">
      <input type="radio" name="material" value="metal" data-multiplier="1.70" onchange="updateTotalPrice()">
      <div class="card-content">
        <span class="material-title">Metal</span>
        <span class="material-desc">فلزی (+۷۰٪)</span>
      </div>
    </label>

  </div>
</div>

<!-- نمایش قیمت نهایی محاسبه شده -->
<div class="price-display">
  <span>قیمت نهایی:</span>
  <span id="final-price-text">0 تومان</span>
</div>

</body>
</html>
