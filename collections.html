<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
      <!-- متاتگ‌های پایه سئو -->
 <meta name="description" content="گالری تابلوهای لوکس و دکوراتیو آویرا؛ عرضه انواع تابلوهای مدرن در طرح‌های نجومی، علمی، تاریخی، خودرو و گیمینگ با کیفیت عالی و سفارش اختصاصی.">
 <meta name="keywords" content="تابلو دکوراتیو, خرید تابلو لوکس, تابلو مدرن, سفارش اختصاصی تابلو, تابلو ماشین, تابلو گیمینگ">
 <meta name="robots" content="index, follow">
 <link rel="canonical" href="https://aviradecoratives.vercel.app/">

 <!-- متاتگ‌های Open Graph (برای نمایش جذاب هنگام اشتراک‌گذاری در تلگرام، واتساپ و شبکه های اجتماعی) -->
 <meta property="og:type" content="website">
 <meta property="og:title" content="AVIRA | گالری تابلوهای لوکس و دکوراتیو">
 <meta property="og:description" content="هنر، امضای فضای شماست. سفارش و خرید انواعی از تابلوهای لوکس و مدرن دکوراتیو.">
 <meta property="og:image" content="https://aviradecoratives.vercel.app/assets/images/logo.png">
 <meta property="og:url" content="https://aviradecoratives.vercel.app/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهده مجموعه | AVIRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="collection-page">

<!-- هدر سایت -->
<header class="header">
    <a href="/" class="logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="assets/images/logo.png" alt="AVIRA" style="width: 35px; height: 35px; object-fit: contain;">
        <span style="color: #fff; font-weight: bold; letter-spacing: 1px;">AVIRA</span>
    </a>

    <nav>
        <a href="/">خانه</a>
        <a href="/#collection">مجموعه‌ها</a>
        <a href="/custom-order">سفارش اختصاصی</a>
    </nav>

    <div class="header-actions">
            <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="تغییر پوسته" aria-label="تغییر پوسته">🌙</button>
        </div>
        <div class="account-cart-group">
            <a href="/cart" class="cart-icon-btn" id="nav-cart-btn" title="سبد خرید">
                🛒 <span class="cart-badge" id="cart-badge">0</span>
            </a>
            <div id="auth-header-container">
        <div id="logged-out-view">
            <a href="/login" class="auth-btn">ورود / ثبت‌نام</a>
        </div>

        <div id="logged-in-view" style="display: none;">
            <div class="user-dropdown">
                <button class="user-dropdown-btn" onclick="toggleUserDropdown()">
                    👤 <span id="user-display-email">حساب من</span> ▾
                </button>
                <div class="dropdown-menu" id="user-dropdown-menu">
                    <a href="/orders">📦 سفارشات من</a>
                    <a href="/settings">⚙️ تنظیمات حساب</a>
                    <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 5px 0;">
                    <a href="#" onclick="logoutUser()" style="color: #f87171;">🚪 خروج از حساب</a>
                </div>
            </div>
        </div>
    </div>
        </div>

    <div class="menu">☰</div>
</header>

<section class="collection-header">
    <h1 id="collection-title">مجموعه</h1>
    <p>طرح مورد نظر خود را انتخاب کنید</p>
</section>

<main class="products-grid" id="products-grid">
</main>

<!-- مودال محصول -->
<div id="product-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeProductModal()">&times;</span>
        
        <div class="modal-body">
            <div class="modal-image">
                <img id="modal-product-img" src="" alt="طرح" draggable="false" oncontextmenu="return false;" onclick="openImageZoom(this.src)" title="برای بزرگ‌نمایی کلیک کنید">
                <div class="zoom-hint">🔍 برای بزرگ‌نمایی کلیک کنید</div>
            </div>
            
            <div class="modal-details">
                <h2 id="modal-product-title">نام طرح</h2>

                <!-- ۱. انتخاب سایز -->
                <div class="size-selection">
                    <label class="section-label">انتخاب سایز:</label>
                    <div class="size-options">
                        <button type="button" class="size-btn active" onclick="selectSize(this)">۲۰×۲۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۲۰×۳۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۳۰×۴۰ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۳۰×۴۵ سانتی‌متر</button>
                        <button type="button" class="size-btn" onclick="selectSize(this)">۴۰×۶۰ سانتی‌متر</button>
                    </div>
                </div>

                <!-- ۲. انتخاب جنس / کیفیت (حذف گزینه فلزی متال) -->
                <div class="material-selection">
                    <label class="section-label">انتخاب جنس / کیفیت:</label>
                    <div class="material-options">
                        <label class="material-card">
                            <input type="radio" name="material" value="economy" data-multiplier="0.85" onchange="updatePriceView()">
                            <div class="card-content">
                                <span class="material-title">Economy</span>
                                <span class="material-desc">اقتصادی (-۱۵٪)</span>
                            </div>
                        </label>

                        <label class="material-card">
                            <input type="radio" name="material" value="normal" data-multiplier="1.0" checked onchange="updatePriceView()">
                            <div class="card-content">
                                <span class="material-title">Normal</span>
                                <span class="material-desc">استاندارد</span>
                            </div>
                        </label>

                        <label class="material-card">
                            <input type="radio" name="material" value="luxury" data-multiplier="1.35" onchange="updatePriceView()">
                            <div class="card-content">
                                <span class="material-title">Luxury</span>
                                <span class="material-desc">لوکس (+۳۵٪)</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- ۳. نمایش قیمت نهایی محاسبه‌شده -->
                <div class="price-display">
                    <span>قیمت نهایی:</span>
                    <span class="price" id="modal-product-price">250,000 Toman</span>
                    <span class="original-price" id="modal-product-original-price" style="display:none;"></span>
                    <span class="discount-badge" id="modal-discount-badge" style="display:none;"></span>
                </div>

                <!-- ۴. دکمه ثبت سفارش -->
                <button class="btn-submit add-to-cart-btn" onclick="addToCart(event)">افزودن به سبد خرید</button>

                <!-- ۵. بخش دیدگاه‌های کاربران -->
                <div class="reviews-section">
                    <label class="section-label">دیدگاه کاربران:</label>

                    <div id="reviews-list" class="reviews-list">
                        <p class="reviews-loading">در حال دریافت دیدگاه‌ها...</p>
                    </div>

                    <div class="review-form" id="review-form-box">
                        <div class="review-stars" id="review-stars">
                            <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
                        </div>
                        <textarea id="review-text" placeholder="نظر خود را درباره این طرح بنویسید..."></textarea>
                        <button type="button" class="btn-submit review-submit-btn" onclick="submitReview()">ثبت دیدگاه</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- لایتباکس بزرگ‌نمایی تصویر -->
<div id="image-zoom-overlay" class="image-zoom-overlay" onclick="if(event.target === this) closeImageZoom();">
    <button type="button" class="zoom-close-btn" onclick="closeImageZoom()">&times;</button>
    <div class="zoom-controls">
        <button type="button" onclick="event.stopPropagation(); adjustZoom(0.25)">➕</button>
        <button type="button" onclick="event.stopPropagation(); adjustZoom(-0.25)">➖</button>
        <button type="button" onclick="event.stopPropagation(); resetZoom()">↺</button>
    </div>
    <img id="zoom-image" src="" alt="نمای بزرگ" draggable="false" oncontextmenu="return false;">
</div>

<script src="script.js"></script>
</body>
</html>
