<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌های پشتیبانی | AVIRA</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .custom-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        .btn-back:hover {
            color: #fff !important;
        }
        #user-support-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            padding: 20px;
            border-radius: 12px;
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="custom-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
            <h1 style="font-size: 1.4rem; color: #d4af37; margin: 0;">💬 گفتگوی آنلاین با پشتیبانی</h1>
            <a href="index.html" class="btn-back" style="color: #d4af37; text-decoration: none; font-size: 0.9rem; transition: 0.3s;">صفحه اصلی ←</a>
        </div>

        <!-- باکس گفتگو (آیدی اصلاح شده برای هماهنگی با script.js) -->
        <div id="user-support-list">
            <div style="text-align: center; color: #aaa; margin: auto;">در حال دریافت پیام‌ها...</div>
        </div>

        <!-- ورودی پیام جدید -->
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <input type="text" id="sup-msg" placeholder="پیام خود را بنویسید..." style="flex: 1; padding: 12px 16px; background: #242424; border: 1px solid #333; color: #fff; border-radius: 10px; font-size: 0.95rem; outline: none;" onkeypress="if(event.key === 'Enter') submitSupportMessage()">
            <button type="button" onclick="submitSupportMessage()" style="background: linear-gradient(135deg, #d4af37, #aa8c2c); color: #121212; border: none; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem;">ارسال</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // فراخوانی خودکار بارگذاری پیام‌ها به محض بالا آمدن صفحه
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadUserSupportTickets === 'function') {
                loadUserSupportTickets();
            }
        });
    </script>
</body>
</html>
