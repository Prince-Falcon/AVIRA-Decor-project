    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIRA | پنل مدیریت</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="custom-order-page">

    <header class="header">
        <a href="/" class="logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <img src="assets/images/logo.png" alt="AVIRA" style="width: 35px; height: 35px; object-fit: contain;">
            <span style="color: #fff; font-weight: bold; letter-spacing: 1px;">AVIRA | پنل مدیریت</span>
        </a>
        <nav>
            <a href="/">صفحه اصلی</a>
        </nav>
    </header>

    <main class="custom-container show" id="login-box" style="margin-top: 100px; position: relative; z-index: 20;">
        <h1>ورود مدیر</h1>
        <p class="subtitle">جهت ورود به پنل اطلاعات زیر را وارد کنید</p>

        <form id="admin-login-form" onsubmit="event.preventDefault(); checkAdminLogin();">
            <div class="form-group">
                <label for="admin-user">ایمیل مدیر:</label>
                <input type="email" id="admin-user" required placeholder="admin@example.com" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="admin-pass">رمز عبور:</label>
                <input type="password" id="admin-pass" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit" style="position: relative; z-index: 30; cursor: pointer;">ورود به پنل</button>
        </form>
    </main>

    <main class="custom-container show" id="admin-dashboard" style="display: none; max-width: 900px; margin-top: 100px; position: relative; z-index: 20;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1>پنل مدیریت آویرا</h1>
                <p class="subtitle">مدیریت سفارشات، کاربران و پیام‌های پشتیبانی</p>
            </div>
            <button onclick="logoutAdmin()" class="btn-submit" style="background:#ef4444; width:auto; padding:8px 15px;">خروج</button>
        </div>

        <div style="display:flex; gap:20px; margin-bottom:20px; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom:10px;">
            <button id="btn-tab-orders" onclick="switchAdminTab('orders')" style="background:transparent; border:none; color:#d4af37; font-size:1.1rem; font-weight:bold; cursor:pointer; opacity:1;">🛍️ سفارشات</button>
            <button id="btn-tab-users" onclick="switchAdminTab('users')" style="background:transparent; border:none; color:#d4af37; font-size:1.1rem; font-weight:bold; cursor:pointer; opacity:0.5;">👥 کاربران</button>
            <button id="btn-tab-support" onclick="switchAdminTab('support')" style="background:transparent; border:none; color:#d4af37; font-size:1.1rem; font-weight:bold; cursor:pointer; opacity:0.5;">💬 پیام‌های پشتیبانی</button>
        </div>

        <div id="tab-orders">
            <div id="orders-list" style="text-align: right;">
                <p style="color: #aaa; text-align: center;">در حال دریافت اطلاعات از دیتابیس...</p>
            </div>
        </div>

        <div id="tab-users" style="display:none;">
            <div id="admin-users-list" style="text-align: right;">
                <p style="color: #aaa; text-align: center;">در حال دریافت اطلاعات کاربران...</p>
            </div>
        </div>

        <div id="tab-support" style="display:none;">
            <div id="admin-support-list" style="text-align: right;">
                <p style="color: #aaa; text-align: center;">در حال دریافت پیام‌ها...</p>
            </div>
        </div>
    </main>

    <audio id="notification-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
